<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Purrfect Pet Care</title>
  <link rel="icon" type="image/png" href="assets/img/paw-favicon.png?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/css/app.css?v=6" rel="stylesheet">
</head>
<body class="app-body">

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html"><img src="assets/img/paws1.png" alt=""><span id="brandName">Purrfect Pet Care</span></a>
    <nav id="sideNav" aria-label="Dashboard"></nav>
    <div class="p-3 border-top border-secondary">
      <button class="btn btn-sm btn-outline-light w-100" id="logoutBtn"><i class="fa-solid fa-right-from-bracket me-1"></i>Log out</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <div class="topbar d-flex align-items-center gap-3">
      <button class="btn btn-light d-lg-none" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <div class="fw-semibold d-none d-sm-block" id="topTitle">Dashboard</div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="dropdown">
          <button class="btn btn-light position-relative" data-bs-toggle="dropdown" data-bs-auto-close="outside" id="notifBtn" aria-label="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" id="notifCount">0</span>
          </button>
          <div class="dropdown-menu dropdown-menu-end p-0 notif-menu shadow">
            <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
              <strong>Notifications</strong><button class="btn btn-link btn-sm p-0" id="markAllRead">Mark all read</button>
            </div>
            <div id="notifList"><div class="p-3 text-muted small">Loading…</div></div>
          </div>
        </div>
        <div class="dropdown">
          <button class="btn btn-light d-flex align-items-center gap-2" data-bs-toggle="dropdown">
            <span class="rounded-circle bg-cream d-grid text-brand fw-bold" style="width:32px;height:32px;place-items:center" id="userInitial">?</span>
            <span class="d-none d-md-inline text-start lh-sm"><span id="userName" class="d-block small fw-semibold"></span><span id="userRole" class="d-block text-muted" style="font-size:.72rem"></span></span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#profile"><i class="fa-regular fa-user me-2"></i>My profile</a></li>
            <li><a class="dropdown-item" href="index.html"><i class="fa-solid fa-globe me-2"></i>Website</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item text-danger" data-logout><i class="fa-solid fa-right-from-bracket me-2"></i>Log out</button></li>
          </ul>
        </div>
      </div>
    </div>
    <div id="modeBanner"></div>
    <main class="content" id="view" tabindex="-1">
      <div class="text-center text-muted py-5"><span class="spinner-border"></span></div>
    </main>
  </div>

  <!-- Reusable modals -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <form class="modal-content" novalidate>
        <div class="modal-header"><h5 class="modal-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <div class="text-danger small me-auto" data-error></div>
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand" data-submit>Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body pt-4"><p class="mb-0" data-message></p></div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">No</button>
          <button type="button" class="btn btn-danger" data-ok>Yes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/common.js?v=6"></script>
  <script src="assets/js/app.js?v=6"></script>
  <script src="assets/js/app2.js?v=6"></script>
</body>
</html>

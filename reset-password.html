<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | Purrfect Pet Care</title>
  <link rel="icon" type="image/png" href="assets/img/paw-favicon.png?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/app.css?v=3" rel="stylesheet">
</head>
<body class="bg-cream d-flex align-items-center" style="min-height:100vh">
  <div class="container" style="max-width:440px">
    <div class="card-x p-4">
      <div class="text-center mb-3"><img src="assets/img/paws1.png" alt="" height="56"></div>
      <h1 class="h4 text-center mb-3">Choose a new password</h1>
      <form id="resetForm" novalidate>
        <div class="mb-3"><label class="form-label">New password</label><input type="password" name="password" class="form-control" required minlength="8" autocomplete="new-password"></div>
        <div class="mb-3"><label class="form-label">Confirm new password</label><input type="password" name="password2" class="form-control" required autocomplete="new-password"></div>
        <div class="form-text mb-3">At least 8 characters, with letters and numbers.</div>
        <div id="msg" class="small mb-3"></div>
        <button class="btn btn-brand w-100" type="submit">Update password</button>
      </form>
      <div class="text-center mt-3"><a href="index.html?login=1" class="small">Back to log in</a></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/common.js?v=3"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const msg = document.getElementById('msg');
    const show = (t, ok) => { msg.textContent = t; msg.className = 'small mb-3 ' + (ok ? 'text-success' : 'text-danger'); };
    if (!token) show('This link is incomplete. Please use the link from your email.');
    loadSession().catch(e => show(e.message));
    document.getElementById('resetForm').addEventListener('submit', async e => {
      e.preventDefault();
      const d = formData(e.target);
      if (d.password !== d.password2) return show('Passwords do not match.');
      await withBusy(e.target.querySelector('button'), async () => {
        try {
          const r = await api('reset_password', { token, password: d.password });
          show(r.message + ' Redirecting…', true);
          setTimeout(() => { location.href = 'index.html?login=1'; }, 1800);
        } catch (err) { show(err.message); }
      });
    });
  </script>
</body>
</html>
